name: Build Launchers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 Framework
        run: |
          curl -LO https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.dmg
          hdiutil attach SDL2-2.30.10.dmg
          sudo cp -R /Volumes/SDL2/SDL2.framework /Library/Frameworks/
          hdiutil detach /Volumes/SDL2
          curl -LO https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.dmg
          hdiutil attach SDL2_mixer-2.8.0.dmg
          sudo cp -R /Volumes/SDL2_mixer/SDL2_mixer.framework /Library/Frameworks/
          hdiutil detach /Volumes/SDL2_mixer
      - name: Build
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          make game CXX="c++" SDL_CFLAGS="-F/Library/Frameworks -I/Library/Frameworks/SDL2.framework/Headers -I/Library/Frameworks/SDL2_mixer.framework/Headers" SDL_LIBS="-F/Library/Frameworks -framework SDL2 -framework SDL2_mixer -Wl,-rpath,@executable_path/../Frameworks"
      - name: Package App and DMG
        run: |
          mkdir -p Starcluster.app/Contents/MacOS
          mkdir -p Starcluster.app/Contents/Frameworks
          mkdir -p Starcluster.app/Contents/Resources
          cp game Starcluster.app/Contents/MacOS/Starcluster

          # Ассеты игры. Без них релиз запускался немым и без портрета Тимертии
          # в интро — SDL_GetBasePath() указывает как раз в Contents/Resources.
          cp timertia.png Starcluster.app/Contents/Resources/
          mkdir -p Starcluster.app/Contents/Resources/music
          cp -R music/processed Starcluster.app/Contents/Resources/music/
          # Слайды комикс-пролога (оболочка ищет comic/slide1..5.png). Кадров
          # может ещё не быть — тогда слайд рисуется пустой рамкой, не ошибкой.
          mkdir -p Starcluster.app/Contents/Resources/comic
          cp comic/*.png Starcluster.app/Contents/Resources/comic/ 2>/dev/null || true

          # Bundle the official SDL2.framework
          cp -R /Library/Frameworks/SDL2.framework Starcluster.app/Contents/Frameworks/
          cp -R /Library/Frameworks/SDL2_mixer.framework Starcluster.app/Contents/Frameworks/

          chmod +x Starcluster.app/Contents/MacOS/Starcluster
          
          # Basic Info.plist
          cat << 'PLIST' > Starcluster.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Starcluster</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.starcluster</string>
            <key>CFBundleName</key>
            <string>Starcluster</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          PLIST
          
          # Re-sign the app since install_name_tool breaks the binary signature
          codesign --force --deep --sign - Starcluster.app
          
          hdiutil create -volname "Starcluster" -srcfolder Starcluster.app -ov -format UDZO Starcluster.dmg
      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-macOS
          path: Starcluster.dmg

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_mixer make
      - name: Build
        run: |
          make game CXX="g++ -static-libgcc -static-libstdc++"
          mv game.exe starcluster.exe
          mkdir -p dist
          cp starcluster.exe dist/
          # ТРАНЗИТИВНОЕ замыкание зависимостей, а не список из трёх DLL.
          # Ручной список был неполон и ломал релиз молча: SDL2_mixer.dll ЖЁСТКО
          # импортирует кодеки (libmpg123-0, libFLAC, libopusfile-0,
          # libvorbisfile-3, libwavpack-1, libxmp), а те тянут libogg/libopus/
          # libvorbis. Windows разрешает импорты при ЗАГРУЗКЕ, поэтому нехватка
          # даёт не «музыка молчит», а «приложение не запускается».
          # Обходим импорты вширь через objdump; своим считаем всё, что лежит в
          # /mingw64/bin, остальное — системные DLL Windows.
          queue="dist/starcluster.exe"
          while [ -n "$queue" ]; do
            next=""
            for bin in $queue; do
              for dep in $(objdump -p "$bin" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p'); do
                if [ -f "/mingw64/bin/$dep" ] && [ ! -f "dist/$dep" ]; then
                  cp "/mingw64/bin/$dep" dist/
                  next="$next dist/$dep"
                fi
              done
            done
            queue="$next"
          done
          echo "DLL в поставке:"; ls dist/*.dll
          # Ассеты игры: без них нет ни музыки, ни портрета Тимертии в интро.
          cp timertia.png dist/
          mkdir -p dist/music
          cp -R music/processed dist/music/
          mkdir -p dist/comic
          cp comic/*.png dist/comic/ 2>/dev/null || true
      - name: Verify DLL closure
        run: |
          # Механическая гарантия вместо честного слова: обходим ВСЕ импорты
          # поставки и валим сборку, если хоть один зовёт DLL из /mingw64/bin,
          # которой в папке нет. Игрок узнал бы об этом окном «не найден
          # libmpg123-0.dll», а мы — здесь.
          missing=""
          for bin in dist/starcluster.exe dist/*.dll; do
            for dep in $(objdump -p "$bin" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p'); do
              if [ ! -f "dist/$dep" ] && [ -f "/mingw64/bin/$dep" ]; then
                missing="$missing $dep(<-$(basename $bin))"
              fi
            done
          done
          if [ -n "$missing" ]; then echo "НЕ ХВАТАЕТ DLL:$missing"; exit 1; fi
          echo "замыкание полное: $(ls dist/*.dll | wc -l) DLL"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Windows
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev
      - name: Build
        run: |
          make game
          mkdir -p dist
          mv game dist/starcluster-linux
          # Ассеты игры рядом с бинарём: SDL_GetBasePath() смотрит именно туда.
          cp timertia.png dist/
          mkdir -p dist/music
          cp -R music/processed dist/music/
          mkdir -p dist/comic
          cp comic/*.png dist/comic/ 2>/dev/null || true
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Linux
          path: dist/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch SDL sources
        run: |
          # Android собирает SDL из ИСХОДНИКОВ (на маке и в Windows берутся
          # готовые фреймворки/пакеты) — своего SDL в системе там нет.
          mkdir -p android/deps && cd android/deps
          curl -LO https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.tar.gz
          curl -LO https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.tar.gz
          tar xzf SDL2-2.30.10.tar.gz
          tar xzf SDL2_mixer-2.8.0.tar.gz
          cd ..
          ln -sfn ../../deps/SDL2-2.30.10 app/jni/SDL
          ln -sfn ../../deps/SDL2_mixer-2.8.0 app/jni/SDL2_mixer
      - name: Install NDK
        run: |
          # Версия прибита в android/app/build.gradle. Ставим ровно её, а не ту,
          # что случайно оказалась предустановлена на раннере.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
          mkdir -p ../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-android/starcluster-android-arm64.apk
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Android
          path: dist-android/

  package-multiplatform:
    needs: [build-mac, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds
          merge-multiple: false
      - name: Create Multiplatform Directory
        run: |
          mkdir Starcluster-Multiplatform
          # Windows и Linux кладём целиком: там теперь не только бинарь, но и
          # ассеты (timertia.png, music/processed, comic/) — они у обеих платформ общие.
          cp -R all-builds/Starcluster-Windows/. Starcluster-Multiplatform/
          cp -R all-builds/Starcluster-Linux/. Starcluster-Multiplatform/
          # macOS самодостаточен: ассеты уже внутри .app.
          mv all-builds/Starcluster-macOS/Starcluster.dmg Starcluster-Multiplatform/
          # Android самодостаточен тем более: ассеты внутри apk, игра
          # распаковывает их при первом запуске (см. android/README.md).
          mv all-builds/Starcluster-Android/starcluster-android-arm64.apk Starcluster-Multiplatform/
      - name: Upload Multiplatform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Multiplatform
          path: Starcluster-Multiplatform/
