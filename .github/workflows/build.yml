name: Build Launchers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 Framework
        run: |
          curl -LO https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.dmg
          hdiutil attach SDL2-2.30.10.dmg
          sudo cp -R /Volumes/SDL2/SDL2.framework /Library/Frameworks/
          hdiutil detach /Volumes/SDL2
          curl -LO https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.dmg
          hdiutil attach SDL2_mixer-2.8.0.dmg
          sudo cp -R /Volumes/SDL2_mixer/SDL2_mixer.framework /Library/Frameworks/
          hdiutil detach /Volumes/SDL2_mixer
      - name: Build
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          make game CXX="c++" SDL_CFLAGS="-F/Library/Frameworks -I/Library/Frameworks/SDL2.framework/Headers -I/Library/Frameworks/SDL2_mixer.framework/Headers" SDL_LIBS="-F/Library/Frameworks -framework SDL2 -framework SDL2_mixer -Wl,-rpath,@executable_path/../Frameworks"
      - name: Package App and DMG
        run: |
          mkdir -p Starcluster.app/Contents/MacOS
          mkdir -p Starcluster.app/Contents/Frameworks
          mkdir -p Starcluster.app/Contents/Resources
          cp game Starcluster.app/Contents/MacOS/Starcluster

          # Ассеты игры. Без них релиз запускался немым и без портрета Тимертии
          # в интро — SDL_GetBasePath() указывает как раз в Contents/Resources.
          cp timertia.png Starcluster.app/Contents/Resources/
          mkdir -p Starcluster.app/Contents/Resources/music
          cp -R music/processed Starcluster.app/Contents/Resources/music/

          # Bundle the official SDL2.framework
          cp -R /Library/Frameworks/SDL2.framework Starcluster.app/Contents/Frameworks/
          cp -R /Library/Frameworks/SDL2_mixer.framework Starcluster.app/Contents/Frameworks/

          chmod +x Starcluster.app/Contents/MacOS/Starcluster
          
          # Basic Info.plist
          cat << 'PLIST' > Starcluster.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Starcluster</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.starcluster</string>
            <key>CFBundleName</key>
            <string>Starcluster</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          PLIST
          
          # Re-sign the app since install_name_tool breaks the binary signature
          codesign --force --deep --sign - Starcluster.app
          
          hdiutil create -volname "Starcluster" -srcfolder Starcluster.app -ov -format UDZO Starcluster.dmg
      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-macOS
          path: Starcluster.dmg

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_mixer make
      - name: Build
        run: |
          make game CXX="g++ -static-libgcc -static-libstdc++"
          mv game.exe starcluster.exe
          mkdir -p dist
          cp starcluster.exe dist/
          cp /mingw64/bin/SDL2.dll dist/
          cp /mingw64/bin/SDL2_mixer.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          # Ассеты игры: без них нет ни музыки, ни портрета Тимертии в интро.
          cp timertia.png dist/
          mkdir -p dist/music
          cp -R music/processed dist/music/
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Windows
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev
      - name: Build
        run: |
          make game
          mkdir -p dist
          mv game dist/starcluster-linux
          # Ассеты игры рядом с бинарём: SDL_GetBasePath() смотрит именно туда.
          cp timertia.png dist/
          mkdir -p dist/music
          cp -R music/processed dist/music/
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Linux
          path: dist/

  package-multiplatform:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds
          merge-multiple: false
      - name: Create Multiplatform Directory
        run: |
          mkdir Starcluster-Multiplatform
          # Windows и Linux кладём целиком: там теперь не только бинарь, но и
          # ассеты (timertia.png, music/processed) — они у обеих платформ общие.
          cp -R all-builds/Starcluster-Windows/. Starcluster-Multiplatform/
          cp -R all-builds/Starcluster-Linux/. Starcluster-Multiplatform/
          # macOS самодостаточен: ассеты уже внутри .app.
          mv all-builds/Starcluster-macOS/Starcluster.dmg Starcluster-Multiplatform/
      - name: Upload Multiplatform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcluster-Multiplatform
          path: Starcluster-Multiplatform/
